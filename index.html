<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root{color-scheme:dark}html,body{margin:0;height:100%;background:#05060f}</style>
<title>Tracing the Pop Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout concept: a single 16x12-tile pixel stage, scaled by --u; every window (dialog, menu, picture) is DOM drawn in Dragon Quest blue-and-white, sized in --u units. */
:root{
  --bg:#05060f; --ink:#f4f8ff; --dim:#9fb0e8; --gold:#ffd23f; --pink:#ff7aa8; --cyan:#4fd6e8; --red:#e14c5a;
  --win-a:#0b1f9a; --win-b:#050a52; --win-edge:#f4f8ff; --win-shadow:#000a40;
  --px:'DotGothic16','Courier New',monospace; --title:'Press Start 2P','Courier New',monospace;
  --u:3px; color-scheme:dark;
}
html,body{height:100%;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--px);overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;}
#app{height:100%;display:flex;flex-direction:column;align-items:center;padding-inline:16px;box-sizing:border-box;}
#wrap{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;}
#stage{position:relative;width:768px;height:576px;background:#000;overflow:hidden;box-shadow:0 0 0 calc(var(--u)*1) #1a2160,0 0 0 calc(var(--u)*2) #000;}
#view{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;}
.win{position:absolute;box-sizing:border-box;color:var(--ink);font-family:var(--px);font-size:calc(var(--u)*8);line-height:1.4;
  background:linear-gradient(180deg,var(--win-a),var(--win-b));border:calc(var(--u)*1.1) solid var(--win-edge);border-radius:calc(var(--u)*2.2);
  box-shadow:0 0 0 calc(var(--u)*.6) #000,inset 0 0 0 calc(var(--u)*.6) var(--win-shadow);padding:calc(var(--u)*3) calc(var(--u)*5);}
.win[hidden]{display:none!important;}
#hudLoc{left:calc(var(--u)*4);top:calc(var(--u)*4);padding:calc(var(--u)*1.5) calc(var(--u)*4);font-size:calc(var(--u)*7);transition:opacity .5s;}
#hudStats{right:calc(var(--u)*4);top:calc(var(--u)*4);padding:calc(var(--u)*1.5) calc(var(--u)*4);display:flex;gap:calc(var(--u)*4);align-items:center;font-size:calc(var(--u)*7);}
#hudStamps{display:flex;gap:calc(var(--u)*1.2);}
.stampDot{width:calc(var(--u)*5);height:calc(var(--u)*5);border:calc(var(--u)*.7) solid #6a78c8;background:#0a1260;border-radius:50%;box-sizing:border-box;}
.stampDot.on{background:var(--gold);border-color:#fff;box-shadow:0 0 calc(var(--u)*2) var(--gold);}
#picWin{left:50%;transform:translateX(-50%);top:calc(var(--u)*4);padding:calc(var(--u)*2.5);}
#pic{display:block;width:calc(var(--u)*104);height:calc(var(--u)*62.4);image-rendering:pixelated;image-rendering:crisp-edges;}
#dialog{left:calc(var(--u)*8);right:calc(var(--u)*8);bottom:calc(var(--u)*5);min-height:calc(var(--u)*48);padding:calc(var(--u)*6) calc(var(--u)*8) calc(var(--u)*5);}
#dName{position:absolute;left:calc(var(--u)*7);top:calc(var(--u)*-5.5);background:linear-gradient(180deg,var(--win-a),var(--win-b));border:calc(var(--u)*1) solid var(--win-edge);border-radius:calc(var(--u)*1.6);padding:0 calc(var(--u)*4);color:var(--gold);font-size:calc(var(--u)*7.5);line-height:1.5;box-shadow:0 0 0 calc(var(--u)*.5) #000;}
#dName:empty{display:none;}
#dText{white-space:pre-wrap;min-height:calc(var(--u)*34);}
#dText .dim{color:var(--dim);}
#dMore{position:absolute;right:calc(var(--u)*8);bottom:calc(var(--u)*3);color:var(--gold);font-size:calc(var(--u)*7);animation:blink .8s steps(2) infinite;}
@keyframes blink{50%{opacity:0;}}
#list{padding:calc(var(--u)*4) calc(var(--u)*6) calc(var(--u)*4) calc(var(--u)*4);display:flex;flex-direction:column;gap:calc(var(--u)*.5);max-height:calc(var(--u)*150);overflow:hidden;}
#list.choice{right:calc(var(--u)*8);bottom:calc(var(--u)*58);}
#list.menu{left:calc(var(--u)*4);top:calc(var(--u)*20);}
#list.center{left:50%;top:50%;transform:translate(-50%,-50%);min-width:calc(var(--u)*120);}
#list .head{color:var(--gold);padding-left:calc(var(--u)*7);margin-bottom:calc(var(--u)*1.5);}
.opt{display:block;background:none;border:0;color:var(--ink);font:inherit;text-align:left;padding:calc(var(--u)*.8) calc(var(--u)*3) calc(var(--u)*.8) calc(var(--u)*7);cursor:pointer;position:relative;white-space:nowrap;}
.opt.sel{color:var(--gold);}
.opt.sel::before{content:"\25B6";position:absolute;left:calc(var(--u)*.5);color:var(--ink);font-size:.8em;top:.15em;}
.opt.off{color:#6a78b8;}
#toast{left:50%;top:34%;transform:translate(-50%,0);text-align:center;color:var(--gold);padding:calc(var(--u)*4) calc(var(--u)*9);animation:pop .35s cubic-bezier(.3,1.6,.5,1);white-space:nowrap;}
@keyframes pop{from{transform:translate(-50%,10px) scale(.6);opacity:0;}to{transform:translate(-50%,0) scale(1);opacity:1;}}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .35s linear;}
#title{position:absolute;inset:0;background:#02030c;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:calc(var(--u)*3);}
#title[hidden]{display:none;}
#stars{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;}
#title>*:not(canvas){position:relative;}
#title h1{margin:0;font-family:var(--title);font-weight:400;font-size:calc(var(--u)*17);line-height:1.25;color:var(--gold);letter-spacing:calc(var(--u)*.5);text-shadow:calc(var(--u)*1) calc(var(--u)*1) 0 #b8462f,calc(var(--u)*2) calc(var(--u)*2) 0 #3a1030;}
#title .sub{font-family:var(--title);font-size:calc(var(--u)*7);color:var(--cyan);letter-spacing:calc(var(--u)*1);}
#title .tag{font-size:calc(var(--u)*7.5);color:var(--dim);max-width:calc(var(--u)*190);}
#title .menu{margin-top:calc(var(--u)*6);display:flex;flex-direction:column;align-items:flex-start;}
#title .foot{position:absolute;bottom:calc(var(--u)*4);font-size:calc(var(--u)*6);color:#6a78b8;}
#hintBar{flex:none;font-size:13px;color:#7f8cc8;padding:6px 0 10px;text-align:center;}
#pad{display:none;flex:none;width:100%;max-width:520px;justify-content:space-between;align-items:center;padding:8px 8px 14px;box-sizing:border-box;}
#dpad{display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,46px);gap:4px;}
.pb{background:#101a70;color:#f4f8ff;border:2px solid #f4f8ff;border-radius:10px;font:inherit;font-size:18px;touch-action:none;display:flex;align-items:center;justify-content:center;}
.pb:active{background:#2a3ab8;}
#ab{display:flex;gap:16px;align-items:center;}
#ab .pb{width:64px;height:64px;border-radius:50%;font-size:20px;}
#ab .pb.a{margin-top:-24px;background:#8a1f3a;}
@media (pointer:coarse),(max-width:760px){#pad{display:flex;}#hintBar{display:none;}}
@media (prefers-reduced-motion:reduce){#dMore{animation:none;}#toast{animation:none;}}
#picWin{animation:dropin .4s cubic-bezier(.2,1.4,.4,1);}
@keyframes dropin{from{transform:translate(-50%,-40%) scale(.5);opacity:0;}to{transform:translate(-50%,0) scale(1);opacity:1;}}
#hudLoc{transition:opacity .6s;}
#titleMenu .opt{font-size:calc(var(--u)*9);padding:calc(var(--u)*1.2) calc(var(--u)*3) calc(var(--u)*1.2) calc(var(--u)*9);}
#titleMenu .opt.sel::before{left:calc(var(--u)*1);}
</style>

<script>
/* ===================== CONTENT (from the group's Milestone 1 paper) ===================== */
const GUIDE_NOTES = [
  { label:"Purpose", pages:[
    "The purpose of our digital museum is to examine and document the development of Philippine popular culture from 2000 to 2010.",
    "It aims to show how technological advancement, mass media, globalization, and changing social practices influenced the way Filipinos communicated, entertained themselves, expressed their identities, and interacted with others." ]},
  { label:"Audience", pages:[
    "Our main audience is Filipino students and young people who were not alive during 2000-2010.",
    "Older Filipinos who lived through the period are welcome too, and may recognize themselves in the exhibits. Scholars, researchers, and teachers interested in Philippine media and popular culture are also invited." ]},
  { label:"Context", pages:[
    "This museum was built around the rapid cultural and technological change the Philippines went through in the 2000s.",
    "Cellphones and text messaging exploded, the internet and social networks arrived, and television, music, cinema, and fashion kept their grip on everyday life." ]}
];

const WINGS = [
 { id:"affect", name:"Affect & Feelings", short:"Affect", icon:"heart", focus:true, theme:"affect", music:"affect",
   timeline:["Movies & radio dramas","Shared teleserye primetime","YouTube, K-drama & TikTok"],
   essay:"TV and music created shared emotional experiences. Teleseryes like “Pangako Sa'Yo,” “Marimar,” and “Sana Maulit Muli,” and reality shows like “Pinoy Big Brother,” made people feel “kilig,” “awa,” and “gigil” together. Music from bands like Parokya ni Edgar and Eraserheads became the soundtrack of memories. This pattern of media shaping emotion holds across decades: before 2000 it was movies and radio dramas, after 2010 it moved to YouTube vlogs, K-dramas on Netflix, and viral TikTok sounds. The difference is that in the 2000s, people felt these emotions together at the same TV time, while today it's personal and on-demand.",
   takeaway:"This period was a period of cultural experiences that shaped people's affects, senses, and feelings. Music, TV, arcade gaming, telephone usage, and fashion were all part of everyday life and brought people together, creating joy, excitement, togetherness, nostalgia, and connection.",
   ex:[
    { t:"The Soundtrack Everywhere", by:"Kaye", src:"Shoop, 2017", pic:{bg:"dusk",o:["boombox","note"]},
      body:"Filipinos frequently listened to CDs, cassette tapes, FM radio, and later MP3 players. In homes, cars, shops, and public spaces, OPM, pop music, and international music were frequently heard." },
    { t:"Kilig, Gigil, and the Bashing Culture", by:"Yza", src:"Tiongson, 2013", pic:{bg:"night",o:["tv","heart"]},
      body:"This decade sparked intense emotions through reality TV and teleserye. Shows like Pinoy Big Brother and Pangako Sa'Yo created “kilig,” “gigil,” and “bashing” culture. Viewers felt personally connected by voting through SMS and discussing episodes in school and online." },
    { t:"“Meteor Garden” Fever", by:"Kirsten", pic:{bg:"dawn",o:["tv","star"]},
      body:"“Meteor Garden” fever in the Philippines made many young Filipinos feel excited and emotionally attached to the series and its characters." },
    { t:"Text Capital of the World", by:"William", pic:{bg:"day",o:["phone","chat"]},
      body:"Text messaging culture created constant emotional connectivity. The Philippines was dubbed the “Text Capital of the World,” fostering an always-on intimacy among family and friends." },
    { t:"The Blue Magic Run", by:"Mendoza", pic:{bg:"dusk",o:["gift","heart"]},
      body:"Filipinos went to Blue Magic as a go-to shop for romantic gifts." } ] },

 { id:"body", name:"Body & Self-Image", short:"Body", icon:"mirror", focus:true, theme:"body", music:"body",
   timeline:["Movie stars & VHS","TV, magazines & pageants","Instagram & K-pop idols"],
   essay:"Pop culture set trends for beauty and style. In the 2000s, celebrities on TV and in magazines promoted tanned or mestiza looks, rebonded hair, and branded clothes from malls like SM and Bench. Music videos and beauty pageants also influenced how teens dressed and acted. This pattern of media affecting self-image holds across decades: before 2000 it was movie stars and VHS tapes, after 2010 it shifted to Instagram models and K-pop idols. The difference in the 2000s is that trends spread slower through TV and magazines, not instantly like on TikTok today.",
   takeaway:"Body image in the decade remained anchored to Western/mestiza beauty ideals, commercialized and intensified through the booming whitening-product and fitness industries.",
   ex:[
    { t:"Comparing Yourself to the Screen", by:"Kaye", pic:{bg:"night",o:["tv","mirror"]},
      body:"Television and advertisements could make people compare their appearance with celebrities and popular images." },
    { t:"The Fair-Skin, Slim-Body Ideal", by:"Yza", pic:{bg:"dawn",o:["mirror","star"]},
      body:"Television and magazine ads promoted the “fair skin” and slim body ideal. Korean dramas and local celebrities influenced how young people dressed and viewed beauty, making appearance a big topic in schools and media." },
    { t:"Low-Rise Jeans and New Hairstyles", by:"Kirsten", pic:{bg:"day",o:["shirt","star"]},
      body:"Low-rise jeans, colorful clothes, and changing hairstyles influenced how Filipino teenagers expressed their appearance and identity." },
    { t:"The Early Aerobics Boom", by:"William", pic:{bg:"dusk",o:["dumbbell","tv"]},
      body:"Gym culture and fitness videos gained traction with the spread of cable TV programming and the early-2000s aerobics trend." },
    { t:"Bench, Penshoppe, and Folded & Hung", by:"Mendoza", pic:{bg:"day",o:["shirt","mall"]},
      body:"The decade showed homegrown fashion brands such as Bench, Penshoppe, and Folded and Hung become household names." } ] },

 { id:"performance", name:"Performance", short:"Performance", icon:"mic", theme:"performance", music:"performance",
   takeaway:"Performance shifted from purely staged forms (teleserye, concerts) toward participatory, amateur spectacle (reality TV, noontime games), democratizing the path to becoming a star.",
   ex:[
    { t:"Mass Media Takes the Stage", by:"Kaye", pic:{bg:"night",o:["tv","mic"]},
      body:"The decade saw a rise in mass media influence, with television, radio, and film becoming dominant platforms for popular culture. The purpose was to entertain, inform, and reflect the social realities of Filipinos." },
    { t:"Reality Formats and Overnight Stars", by:"Yza", pic:{bg:"dusk",o:["mic","star"]},
      body:"Performance shifted to “reality” formats. Talent and survival shows like Star in a Million and Pinoy Dream Academy made it possible for ordinary Filipinos to become stars overnight. The focus was on raw talent and audience votes." },
    { t:"Eat Bulaga, Wowowee, and ASAP", by:"Kirsten", pic:{bg:"day",o:["tv","note"]},
      body:"Variety shows like Eat Bulaga!, Wowowee, and ASAP made singing and dancing common forms of entertainment." },
    { t:"The OPM Band Resurgence", by:"William", pic:{bg:"night",o:["guitar","note"]},
      body:"The OPM band scene resurged with acts like Rivermaya, Parokya ni Edgar, and Kamikazee performing in bars and gigs, alongside an emerging “indie” performance culture." },
    { t:"Dance Crazes in the Classroom", by:"Mendoza", pic:{bg:"dawn",o:["note","star"]},
      body:"The Philippines got hooked with dance crazes and jingle songs which students used in school performances." } ] },

 { id:"space", name:"Space", short:"Space", icon:"mall", theme:"space", music:"space",
   takeaway:"The 2000s marked a significant transformation of cultural spaces, as urban centers, media platforms, and public venues became important sites for cultural production, social interaction, and identity formation.",
   ex:[
    { t:"Metro Manila as Cultural Hub", by:"Kaye", pic:{bg:"dawn",o:["mall","pin"]},
      body:"Urban centers like Metro Manila became cultural hubs with malls, cinemas, concert venues, and TV studios serving as key sites for popular culture activities. Public spaces such as plazas and streets also hosted festivals and performances." },
    { t:"SM, Glorietta, and the Internet Café", by:"Yza", pic:{bg:"day",o:["mall","pc"]},
      body:"Malls became the main social spaces for youth. Places like SM and Glorietta hosted concerts, album launches, and fan meet-ups. Internet cafés also served as key spaces for gaming, chatting, and accessing Friendster." },
    { t:"The Family Videoke Setup", by:"Kirsten", pic:{bg:"night",o:["mic","tv"]},
      body:"Videoke bars and family videoke setups became popular social spaces where Filipinos gathered to sing and spend time together." },
    { t:"DOTA, Counter-Strike, and Friendster Nights", by:"William", pic:{bg:"night",o:["pc","chat"]},
      body:"Internet cafés proliferated as new communal-digital spaces for youth, used for online gaming (DOTA, Counter-Strike) and early social networking (Friendster)." },
    { t:"The Milo Truck at the School Gate", by:"Mendoza", pic:{bg:"day",o:["cup","sun"]},
      body:"The Milo truck visited schools, and children lined up for a free cup of cold Milo drink." } ] },

 { id:"time", name:"Time", short:"Time", icon:"clock", theme:"time", music:"time",
   takeaway:"The decade reflected the country's transition toward modernization and globalization, characterized by significant political, economic, technological, and cultural transformation that influenced everyday lifestyles.",
   ex:[
    { t:"Globalization on a Timeline", by:"Kaye", src:"Toral, 2003", pic:{bg:"dawn",o:["clock","globe"]},
      body:"The country experienced economic challenges and gradual globalization, influencing consumer behavior and cultural production." },
    { t:"Prime Time and Unli-Text Hours", by:"Yza", pic:{bg:"night",o:["tv","clock"]},
      body:"Daily routines followed media schedules. After-school hours were for anime and teen shows, 6–9pm was “prime time” for teleseryes, and late nights were peak hours for “unli-text” promotions." },
    { t:"The Ber Months Begin", by:"Kirsten", pic:{bg:"night",o:["tree","star"]},
      body:"The “ber months” Christmas season became associated with starting Christmas celebrations as early as September, including Christmas music and decorations." },
    { t:"Teleserye Structured the Household", by:"William", pic:{bg:"dusk",o:["tv","heart"]},
      body:"Teleserye scheduling structured domestic daily routines around fixed primetime blocks, organizing family time around the television." },
    { t:"The Pacquiao Fight Effect", by:"Mendoza", pic:{bg:"night",o:["glove","clock"]},
      body:"Manny Pacquiao's fight time is known to result in no traffic in EDSA and zero crime rate." } ] },

 { id:"technology", name:"Technology", short:"Technology", icon:"phone", focus:true, theme:"technology", music:"technology",
   timeline:["Landlines & letters","Texting & internet cafés","Smartphones & home WiFi"],
   essay:"A common pattern in 2000-2010 was the rise of mobile technology and the internet in daily Filipino life. Text messaging, or “texting,” became the main way to communicate because of affordable “unli-text” promos from Globe and Smart. Internet cafés or “comshops” were the main spaces for playing games like Ragnarok and accessing Friendster and Multiply. This pattern holds across decades: before 2000, Filipinos used landlines and letters; after 2010, the same need to connect shifted to smartphones, Facebook, and mobile data. From SMS and comshops to apps and home WiFi.",
   takeaway:"Technological development from 2000-2010 reflected the country's increasing integration into the global economy and emerging information society, though electronics exports remained largely dependent on assembly and testing with limited domestic value added.",
   ex:[
    { t:"SMS as a Political Tool", by:"Kaye", src:"Toral, 2003", pic:{bg:"dawn",o:["phone","chat"]},
      body:"SMS became a dominant communication technology and was used for both personal and political mobilization." },
    { t:"Jejemon, Bluetooth, and Friendster", by:"Yza", pic:{bg:"night",o:["phone","chat"]},
      body:"Mobile phones became personal devices. Texting in “jejemon” language and sending ringtones/MP3s via Bluetooth were common. Friendster and Multiply were the main social media platforms for self-expression." },
    { t:"Nokia, Texting, and Friendster", by:"Kirsten", pic:{bg:"day",o:["phone","note"]},
      body:"Nokia phones, text messaging, and Friendster changed how Filipino teenagers communicated and interacted with others." },
    { t:"The VCD and DVD Piracy Economy", by:"William", pic:{bg:"dusk",o:["cd","tv"]},
      body:"VCD/DVD piracy and early file-sharing shaped everyday access to global music and film for most Filipino households." },
    { t:"CD-R King and the Lovebug Virus", by:"Mendoza", pic:{bg:"night",o:["cd","bug"]},
      body:"CD-R King, known for selling affordable computer accessories, expanded its branches. Meanwhile, the infamous Lovebug virus, developed by a Filipino student, infected millions of Windows computers." } ] },

 { id:"globalization", name:"Globalization", short:"Globalization", icon:"globe", theme:"globalization", music:"globalization",
   takeaway:"Globalization in the Philippines was a mixed process: it expanded trade, migration, and modern services, and local culture absorbed global media bidirectionally, but it also increased vulnerability and left major social inequalities unresolved.",
   ex:[
    { t:"Remittances and New Labor Flows", by:"Kaye", pic:{bg:"dawn",o:["plane","peso"]},
      body:"Overseas work became part of the globalization model, bringing remittances and new flows of labor, but also creating policy dilemmas around protection and reintegration." },
    { t:"The Korean Wave Arrives", by:"Yza", pic:{bg:"dusk",o:["tv","heart"]},
      body:"The Korean Wave entered the Philippines through dramas and music. American reality TV formats were also adopted locally, showing how global trends were mixed with Filipino culture." },
    { t:"The K-Pop and Anime Wave", by:"Kirsten", pic:{bg:"night",o:["star","note"]},
      body:"K-pop, anime, and other East Asian media became increasingly popular among Filipino youth." },
    { t:"Charice's Viral Breakthrough", by:"William", pic:{bg:"day",o:["camera","mic"]},
      body:"Filipino performers gained international recognition, most notably Charice Pempengco's 2007 viral YouTube fame, showing new global routes to stardom." },
    { t:"A Virus That Went Global", by:"Mendoza", pic:{bg:"night",o:["bug","globe"]},
      body:"The infamous Lovebug virus, developed by a Filipino student, had infected millions of Windows computers worldwide." } ] }
];

const DAWN_LINES = [
  { who:"Kaye", pages:["The popular culture of the Philippines from 2000 to 2010 can be characterized as the “Digital Dawn Era.”","This was the decade when technology like mobile phones, SMS, and internet cafés became part of daily Filipino life."] },
  { who:"Yza", pages:["It was also the decade when television shows and music created strong shared emotions, like “kilig,” “awa,” and “gigil,” that connected people nationwide."] },
  { who:"Kirsten", pages:["At the same time, celebrities and media began to heavily influence beauty standards and fashion, from rebonded hair to mall brands."] },
  { who:"William", pages:["Many patterns that started in the 2000s, like texting culture, reality TV participation, and media-driven self-image, are still present today but have evolved with social media and smartphones."] },
  { who:"Mendoza", pages:["The 2000-2010 period served as the bridge between analog culture and the digital, interactive culture we have now."] }
];
const TOTAL_EX = WINGS.reduce((n,w)=>n+w.ex.length,0);
/* ===================== PIXEL ART: palette, 16x16 object sprites, exhibit pictures ===================== */
const PAL={k:'#1b1b2f',w:'#f4f8ff',g:'#aab4c8',G:'#5b6478',r:'#e14c5a',R:'#9a2a3a',o:'#f0913a',y:'#ffd23f',Y:'#c9962a',

const charCache={};
function drawCharFrame(g,dir,fr,p){
  const R=(x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(x,y,w,h);};
  R(4,14,8,2,'rgba(0,0,0,.28)');
  const lH=fr?2:3,rH=fr?3:2;
  const body=()=>{R(4,9,8,4,p.top);R(4,9,8,1,p.acc);R(4,12,8,1,p.belt||p.acc);R(3,10,1,3,p.top);R(12,10,1,3,p.top);R(3,13,1,1,p.skin);R(12,13,1,1,p.skin);};
  const legs=()=>{R(5,13,2,lH,p.bot);R(9,13,2,rH,p.bot);if(lH===3)R(5,15,2,1,'#2a1e1a');if(rH===3)R(9,15,2,1,'#2a1e1a');};
  if(dir==='u'){
    if(p.cape)R(3,9,10,5,p.cape);
    legs();if(!p.cape)body();else{R(4,9,8,1,p.acc);}
    R(4,2,8,7,p.skin);R(3,1,10,9,p.hair);if(p.spike){R(4,0,2,1,p.hair);R(7,0,2,1,p.hair);R(10,0,2,1,p.hair);}
    if(p.long)R(3,4,10,9,p.hair);if(p.band)R(3,3,10,1,p.band);if(p.hat){R(3,0,10,2,p.hat);R(2,2,12,1,p.hat);}
  }else if(dir==='d'){
    legs();body();if(p.cape){R(3,10,1,4,p.cape);R(12,10,1,4,p.cape);}
    R(4,2,8,7,p.skin);R(3,1,10,3,p.hair);R(3,4,1,3,p.hair);R(12,4,1,3,p.hair);R(4,4,8,1,p.hair);
    if(p.spike){R(4,0,2,1,p.hair);R(7,0,2,1,p.hair);R(10,0,2,1,p.hair);}
    if(p.long){R(3,4,2,8,p.hair);R(11,4,2,8,p.hair);}
    if(p.band)R(3,3,10,1,p.band);
    R(5,6,1,2,'#1b1b2f');R(10,6,1,2,'#1b1b2f');R(7,8,2,1,'#c98a6a');
    if(p.hat){R(3,0,10,2,p.hat);R(2,2,12,1,p.hat);}
  }else{ // left (right is mirrored)
    legs();R(5,9,7,4,p.top);R(5,9,7,1,p.acc);R(5,12,7,1,p.belt||p.acc);R(6,10,3,3,p.top);R(6,13,1,1,p.skin);
    if(p.cape)R(10,9,3,5,p.cape);
    R(4,2,8,7,p.skin);R(4,1,9,3,p.hair);R(9,3,4,6,p.hair);R(4,4,1,2,p.hair);
    if(p.spike){R(5,0,2,1,p.hair);R(8,0,2,1,p.hair);R(11,0,2,1,p.hair);}
    if(p.long)R(9,3,4,10,p.hair);
    if(p.band)R(4,3,9,1,p.band);
    R(5,6,1,2,'#1b1b2f');
    if(p.hat){R(4,0,9,2,p.hat);R(3,2,10,1,p.hat);}
  }
}
function charFrames(p){
  const key=JSON.stringify(p);
  if(charCache[key])return charCache[key];
  const out={};
  ['d','u','l','r'].forEach(dir=>{out[dir]=[0,1].map(fr=>{
    const c=cv(16,16),g=c.getContext('2d');
    if(dir==='r'){g.translate(16,0);g.scale(-1,1);drawCharFrame(g,'l',fr,p);}else drawCharFrame(g,dir,fr,p);
    return c;});});
  return charCache[key]=out;
}

  const ch=tileCh(m,x,y);

    S.walkT+=dt;
    const mv=v=>v>0?Math.max(0,v-sp):Math.min(0,v+sp);
    S.ox=mv(S.ox);S.oy=mv(S.oy);
    if(!S.ox&&!S.oy){AU.sfx('step');if(checkWarp())return;}
  }
  if(S.mode==='world'&&!S.ox&&!S.oy&&keys.held.length){
    const k=keys.held[keys.held.length-1],d=dirOf(k),v=DIRV[d];
    S.dir=d;
    const nx=S.px+v[0],ny=S.py+v[1];
    if(!isBlocked(S.map,nx,ny)){S.px=nx;S.py=ny;S.ox=-v[0]*16;S.oy=-v[1]*16;S.stepFrame^=1;}
    else if(S.time-S.bumpT>.35){S.bumpT=S.time;AU.sfx('bump');}
  }
  if(!S.ox&&!S.oy&&!keys.held.length)S.walkT=0;
}
function updateNpcs(dt){
  const m=S.map,sp=48*dt;
  npcs(m).forEach(n=>{
    if(n.ox||n.oy){
      const mv=v=>v>0?Math.max(0,v-sp):Math.min(0,v+sp);
      n.ox=mv(n.ox);n.oy=mv(n.oy);n.walkT+=dt;n.fr=((n.walkT*6)|0)&1;
      return;
    }
    n.fr=0;
    if(!n.wander||S.mode!=='world')return;
    n.wt-=dt;
    if(n.wt>0)return;
    n.wt=1+Math.random()*2.5;
    const d='udlr'[(Math.random()*4)|0],v=DIRV[d],nx=n.x+v[0],ny=n.y+v[1];
    n.dir=d;
    if(Math.abs(nx-n.hx)>3||Math.abs(ny-n.hy)>3)return;
    const ch=tileCh(m,nx,ny);
    if(ch==='D'||ch==='G'||ch==='_'&&false)return;
    if(isBlocked(m,nx,ny,n)||(S.px===nx&&S.py===ny)||(S.ox||S.oy)&&false)return;
    n.x=nx;n.y=ny;n.ox=-v[0]*16;n.oy=-v[1]*16;
  });
}

  if(o.kind==='giant'){vg.drawImage(propCanvas('giant',o.a),x,y+(o.bob?Math.round(Math.sin(t*2.2)*1.2):0));return;}
  vg.drawImage(propCanvas(o.kind,o.a,o.b),x,y);
}
function render(){
  const m=S.map;if(!m)return;
  const t=S.time,vw=256,vh=192,mw=m.w*16,mh=m.h*16;
  let cx=Math.round(S.px*16+S.ox+8-vw/2),cy=Math.round(S.py*16+S.oy+8-vh/2);
  cx=mw<=vw?-Math.round((vw-mw)/2):Math.max(0,Math.min(mw-vw,cx));
  cy=mh<=vh?-Math.round((vh-mh)/2):Math.max(0,Math.min(mh-vh,cy));
  vg.fillStyle='#000';vg.fillRect(0,0,vw,vh);
  vg.save();vg.translate(-cx,-cy);
  const wf=((t*2)|0)&1;
  const x0=Math.max(0,(cx>>4)-0),x1=Math.min(m.w-1,((cx+vw)>>4)),y0=Math.max(0,cy>>4),y1=Math.min(m.h-1,((cy+vh)>>4));
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
    const ch=m.t[y][x];
    vg.drawImage(tileCanvas(ch,m.theme,(x*3+y*5)&3,ch==='~'?wf:0,ch==='G'&&S.gateOpen?1:0),x*16,y*16);
  }
  const list=[];
  m.objs.forEach(o=>{
    const h=o.h||1;
    list.push({o,z:(o.k==='exhibit'&&o.kind==='painting')?-1:(o.y+h)*16+(o.k==='npc'?o.oy:0)});
  });
  list.push({o:null,z:(S.py+1)*16+S.oy});
  list.sort((a,b)=>a.z-b.z);
  list.forEach(it=>{
    if(it.o)drawObj(it.o,t);
    else{
      const f=charFrames(HERO)[S.dir][(S.ox||S.oy)?(S.stepFrame):0];
      const bob=(S.ox||S.oy)?(Math.abs(Math.sin(S.walkT*14))>.5?-1:0):0;
      vg.drawImage(f,Math.round(S.px*16+S.ox),Math.round(S.py*16+S.oy-3+bob));
    }
  });
  // interaction marker
  const fo=frontObj();
  if(fo){
    const bx=(fo.k==='npc'?fo.x*16:fo.x*16+((fo.w||1)*8)-8),by=fo.y*16-9+Math.round(Math.sin(t*6)*1.5);
    vg.fillStyle='#000';vg.fillRect(bx+5,by,7,6);vg.fillStyle='#ffd23f';vg.fillRect(bx+6,by+1,5,4);
    vg.fillStyle='#000';vg.fillRect(bx+8,by+2,1,2);
  }
  sparkles=sparkles.filter(s=>(s.l-=.016)>0);
  sparkles.forEach(s=>{vg.fillStyle=s.l>.35?'#fff6b0':'#ffd23f';vg.fillRect(Math.round(s.x),Math.round(s.y-(0.7-s.l)*14),1,1);});
  vg.restore();
  if(m.id!=='grounds')vg.drawImage(vignette,0,0);
}

/* ===================== ENGINE UI: dialogue, menus, interactions, title ===================== */
function paginate(text,max){
  max=max||150;const out=[];
  String(text).split('\n').forEach(par=>{
    const words=par.split(/\s+/);let cur='';
    words.forEach(w=>{if((cur+' '+w).trim().length>max&&cur){out.push(cur);cur=w;}else cur=(cur?cur+' ':'')+w;});
    if(cur)out.push(cur);
  });
  return out;
}
/* ---------- say ---------- */
let SAY=null,lastBlip=0;
function say(name,pages,opts){
  opts=opts||{};
  if(typeof pages==='string')pages=paginate(pages);
  const prev=S.mode;
  return new Promise(res=>{
    S.mode='say';hudVisible(false);
    $('dName').textContent=name||'';$('dialog').hidden=false;
    SAY={pages:pages.slice(),i:-1,typing:false,full:'',pos:0,res:()=>{ $('dialog').hidden=true;SAY=null;S.mode=opts.keepMode||prev==='busy'?'busy':'world';if(S.mode==='world')hudVisible(true);res();},dim:opts.dim};
    sayNext();
  });
}
function sayNext(){
  const s=SAY;if(!s)return;
  s.i++;
  if(s.i>=s.pages.length){s.res();return;}
  s.full=s.pages[s.i];s.pos=0;s.typing=true;$('dMore').style.visibility='hidden';
  const dim=/^Source:/.test(s.full);
  $('dText').className=dim?'dim':'';
  $('dText').textContent='';
  if(s.i>0)AU.sfx('page');
  const tick=()=>{
    if(!SAY||SAY!==s||!s.typing)return;
    s.pos+=1;$('dText').textContent=s.full.slice(0,s.pos);
    if(S.time-lastBlip>.07){lastBlip=S.time;AU.sfx('blip');}
    if(s.pos>=s.full.length){s.typing=false;$('dMore').style.visibility='visible';return;}
    setTimeout(tick,/[.,!?:]/.test(s.full[s.pos-1])?90:24);
  };
  tick();
}
function sayPress(){
  const s=SAY;if(!s)return;
  if(s.typing){s.typing=false;s.pos=s.full.length;$('dText').textContent=s.full;$('dMore').style.visibility='visible';}
  else sayNext();
}

/* ---------- pick (menus) ---------- */
let PICK=null;
function pick(head,items,o){
  o=o||{};
  return new Promise(res=>{
    const prevMode=S.mode;
    const el=o.el||$('list');
    PICK={items,sel:o.sel||0,el,head,cancel:o.cancel!==false,prevMode,res:v=>{PICK=null;if(!o.el){el.hidden=true;}S.mode=o.keepMode||(prevMode==='title'?'title':prevMode==='pick'?'pick':'say'===prevMode?'say':prevMode);res(v);},opts:o};
    if(!o.el){el.className='win '+(o.cls||'choice');el.hidden=false;}
    if(prevMode==='world'){hudVisible(false);}
    S.mode='pick';
    renderPick();
  });
}
function renderPick(){
  const p=PICK;if(!p)return;
  p.el.innerHTML='';
  if(p.head){const h=document.createElement('div');h.className='head';h.textContent=p.head;p.el.appendChild(h);}
  p.items.forEach((it,i)=>{
    const b=document.createElement('button');b.type='button';b.className='opt'+(i===p.sel?' sel':'')+(it.off?' off':'');
    b.textContent=it.label||it;
    b.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();AU.init();if(PICK===p){p.sel=i;renderPick();pickPress('a');}});
    p.el.appendChild(b);
  });
}
function pickPress(k){
  const p=PICK;if(!p)return;
  if(k==='up'||k==='down'){
    const n=p.items.length;p.sel=(p.sel+(k==='down'?1:n-1))%n;AU.sfx('select');renderPick();
  }else if(k==='a'){AU.sfx('confirm');p.res(p.sel);}
  else if(k==='b'&&p.cancel){AU.sfx('cancel');p.res(-1);}
}
async function choose(name,pages,items,o){
  // show a dialogue line and a choice list on top of it
  const prev=S.mode;S.mode='busy';
  $('dName').textContent=name||'';$('dText').className='';$('dText').textContent=pages;$('dMore').style.visibility='hidden';$('dialog').hidden=false;hudVisible(false);
  const v=await pick(null,items,Object.assign({cls:'choice',keepMode:'busy'},o||{}));

}

async function interact(){

async function viewJournal(wid,i){
  const w=WINGS.find(x=>x.id===wid),e=w.ex[i];
  showPic(e.pic);$('list').hidden=true;
  const pages=paginate(e.body);pages.push('Source: '+(e.src?e.src+'  ·  ':'')+'Curated by '+e.by);
  await say(e.t,pages,{keepMode:true});
  $('picWin').hidden=true;S.mode='busy';
}

/* ---------- title & start ---------- */
async function titleScreen(){
  S.mode='title';$('title').hidden=false;hudVisible(false);
  const has=!!loadSave();
  for(;;){
    const items=[{label:'New Quest'}];if(has)items.push({label:'Continue'});items.push({label:'Sound: '+(AU.on?'On':'Off')});
    const v=await pick(null,items,{el:$('titleMenu'),cancel:false,keepMode:'title'});
    const lab=items[v].label;
    if(lab.startsWith('Sound')){AU.toggle();continue;}
    return lab;
  }
}
async function startGame(mode){
  AU.init();
  await fadeTo(1);
  $('title').hidden=true;
  const sv=mode==='Continue'?loadSave():null;
  if(sv){
    S.seen=sv.seen||{};S.chests=sv.chests||{};S.gateOpen=!!sv.gateOpen;S.gateAnnounced=!!sv.gateAnnounced;
    S.dawnTalked=sv.dawnTalked||{};S.visited=sv.visited||{};S.introDone=!!sv.introDone;S.ended=!!sv.ended;
    const m=MAPS[sv.map]?sv.map:'grounds';
    enterMap(m,sv.px,sv.py,sv.dir);
  }else{
    const g=MAPS.grounds;enterMap('grounds',g.start.x,g.start.y,g.start.d);
  }
  S.mode='busy';hudVisible(true);updateHud();
  await fadeTo(0);
  if(!S.introDone){
    S.introDone=true;
    await say('Guide',["Welcome, traveler, to the Tracing the Pop museum!","Inside, seven wings hold a decade of Philippine popular culture, 2000 to 2010. Walk up to anything and press Enter, Space or E.","Find me by the steps if you want the museum's story. Good luck!"],{keepMode:true});
    S.mode='world';hudVisible(true);saveGame();
  }else S.mode='world';
}
(async function init(){
  fit();
  requestAnimationFrame(frame);
  for(;;){
    const mode=await titleScreen();
    await startGame(mode);
    return;
  }
})();
</script>
